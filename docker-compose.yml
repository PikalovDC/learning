version: '3.8'

services:
  db:
    image: postgres:15
    container_name: learning_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${NAME:-school}
      POSTGRES_USER: ${USER:-school_user}
      POSTGRES_PASSWORD: ${PASSWORD:-school_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER:-school_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  redis:
    image: redis:7-alpine
    container_name: learning_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  web:
    build: .
    container_name: learning_web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY}
      - NAME=${NAME:-school}
      - USER=${USER:-school_user}
      - PASSWORD=${PASSWORD:-school_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learning_network

  celery:
    build: .
    container_name: learning_celery
    command: celery -A celery_app worker --loglevel=info -P eventlet
    volumes:
      - .:/app
    environment:
      - NAME=${NAME:-school}
      - USER=${USER:-school_user}
      - PASSWORD=${PASSWORD:-school_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learning_network

  celery-beat:
    build: .
    container_name: learning_celery_beat
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - NAME=${NAME:-school}
      - USER=${USER:-school_user}
      - PASSWORD=${PASSWORD:-school_password}
      - HOST=db
      - PORT=${PORT:-5432}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learning_network

networks:
  learning_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: